<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>视频</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none; /* 禁 iOS 长按菜单（保存图片/复制链接等） */
    }

    body {
      display: flex;
    }
    video {
      display: block;
      width: 100%;
      max-height: 100vh;
      object-fit: contain; /* 想铺满全屏改成 cover（画面会被裁切） */
      margin: auto;
    }
  </style>
</head>
<body>
  <!-- 把 src 换成你自己的视频地址（相对路径或 https 绝对地址均可） -->
  <video id="player"
        src="video.mp4"
        preload="auto"
        muted
        loop
        playsinline
        webkit-playsinline
        x5-playsinline="true"
        x5-video-player-type="h5"
        x5-video-orientation="portrait"
        controls
        >
  </video>

  <!-- ================= 禁止转发/分享（微信 + QQ） ================= -->
  <script>
    (function () {
      /* ---- 通用：禁长按菜单 / 选择 / 拖拽 ---- */
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('selectstart', function (e) { e.preventDefault(); });
      document.addEventListener('dragstart', function (e) { e.preventDefault(); });

      /* ---- 微信·官方 JS-SDK（最可靠，需认证公众号 + 后端签名）----
         有后端时把配置填进 getWxJsSdkConfig()，或改成从你的接口拉取；
         没有公众号/后端时保持返回 null，自动走下面的桥接方案。 */
      function getWxJsSdkConfig() {
        return null;
        /*
        return {
          appId: '你的appId',
          timestamp: 1234567890,      // 后端生成
          nonceStr: '随机串',          // 后端生成
          signature: '后端算出的签名'   // 后端生成
        };
        */
      }

      function initWechatOfficial() {
        if (typeof wx === 'undefined') return;
        var cfg = getWxJsSdkConfig();
        if (!cfg) return;
        wx.config({
          debug: false,
          appId: cfg.appId,
          timestamp: cfg.timestamp,
          nonceStr: cfg.nonceStr,
          signature: cfg.signature,
          jsApiList: ['hideAllNonBaseMenuItem']
        });
        wx.ready(function () {
          try { wx.hideAllNonBaseMenuItem(); } catch (e) {}
        });
        wx.error(function () {
          hideWechatMenuByBridge(); // 签名失败退回桥接
        });
      }

      /* ---- 微信·桥接接口（无需公众号，多数版本仍有效） ---- */
      function hideWechatMenuByBridge() {
        console.log('WeixinJSBridge', WeixinJSBridge)
        try { WeixinJSBridge.call('hideOptionMenu'); } catch (e) {}
        try { WeixinJSBridge.call('hideToolbar'); } catch (e) {}
      }
      document.addEventListener('WeixinJSBridgeReady', hideWechatMenuByBridge, false);
      if (typeof WeixinJSBridge !== 'undefined') hideWechatMenuByBridge();

      /* ---- QQ 内置浏览器·老桥接接口（无官方方案，部分版本失效） ---- */
      document.addEventListener('QBridgeReady', function () {
        try { QZWebViewJavascriptBridge.call('hideOptionMenu'); } catch (e) {}
        try { QZWebViewJavascriptBridge.call('hideToolBar'); } catch (e) {}
      }, false);

      initWechatOfficial();
    })();
  </script>

  <script>
    (function () {
      /* ---- 来源判定：是否由短链入口页 n3u6eipb82.html 跳转过来 ----
         两页同源，location.replace 跳转不会丢 referrer，默认 Referrer-Policy 下同导航能拿到完整路径；
         只比对文件名，避开 /docs 子目录、http/https、端口等环境差异 */
      console.log('window.location.referrer', window.location.referrer)
      var fromEntry = (document.referrer || '').indexOf('n3u6eipb82.html') > -1;
      console.log('fromEntry', fromEntry)

      var video = document.getElementById('player');
      var played = false;

      function getUrl() {
        // 视频地址列表，下标与页面地址上的 urlIndex 一一对应
        var srcList = [
          'https://lf3-static.bytednsdoc.com/obj/eden-cn/nupenuvpxnuvo/xgplayer_doc/xgplayer-demo.mp4',
          'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
          'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/friday.mp4',
        ];
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var matched = search.match(/[?&]order=([^&#]*)/) || hash.match(/[?&]order=([^&#]*)/);
        var index = (matched ? parseInt(matched[1]) : 0) - 1;
        return srcList[index];
      }

      function tryPlay() {
        if (played) return;
        var url = getUrl();
        if (!url) return alert('参数异常')
        video.src = url;
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      }

      function onStarted() {
        played = true;
      }
      video.addEventListener('playing', onStarted);

      // 微信内置浏览器：等待 JSBridge 就绪后尝试自动播放
      function WeixinJSBridgeReady() {
        tryPlay();
      }
      if (typeof WeixinJSBridge !== 'undefined') {
        WeixinJSBridgeReady();
      } else {
        document.addEventListener('WeixinJSBridgeReady', WeixinJSBridgeReady, false);
      }

      // 部分机型（尤其 iOS）必须有一次用户手势才能播放，首次触摸时再尝试
      document.addEventListener('touchstart', function once() {
        video.muted = false; // 用户首次触摸后恢复声音；若希望一直静音可删掉这行
        tryPlay();
        document.removeEventListener('touchstart', once);
      }, { passive: true });

      // 兜底尝试
      tryPlay();
    })();
  </script>
</body>
</html>
